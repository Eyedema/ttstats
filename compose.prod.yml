services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - pingpong_network

  redis:
    image: redis:7-alpine
    container_name: ttstats_redis_prod
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - redis_data_prod:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    networks:
      - pingpong_network

  web:
    # CI builds this and pushes it to GHCR; the deploy pulls it. The VPS has
    # 3.7GB of RAM and building here used to reach the OOM killer. WEB_IMAGE is
    # pinned to a commit SHA by the deploy job -- the :latest default is only
    # for running compose by hand on the box.
    image: ${WEB_IMAGE:-ghcr.io/eyedema/ttstats-web:latest}
    # Retained so `docker compose build` still works locally; normal deploys
    # never reach it, because they pull first.
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DJANGO_ENV: prod
      # Set by the deploy job to the commit SHA that WEB_IMAGE is pinned to.
      # Empty when compose is run by hand on the box, which just means the
      # issue carries no release -- never an error.
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    volumes:
      - static_volume:/app/static
    # KAN-109. GET /healthz from inside the container: plain HTTP to
    # 127.0.0.1, which HealthzMiddleware answers ahead of host validation and
    # the HTTPS redirect. 503 (DB down, migration pending) or no answer within
    # the timeout counts as a failure; Redis down does not (`degraded`, 200).
    # The image has no curl, hence python. Docker does not restart an
    # unhealthy container on its own: the status is what the deploy's swap
    # and smoke test wait on (deploy/deploy.sh).
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=8).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # The entrypoint may run collectstatic + migrate before gunicorn binds.
      start_period: 120s
      start_interval: 2s
    depends_on:
      - db
      - redis
    networks:
      - pingpong_network
      - pangolin

volumes:
  pgdata:
  redis_data_prod:
  static_volume:

networks:
  pingpong_network:
    driver: bridge
  pangolin:
    external: true
