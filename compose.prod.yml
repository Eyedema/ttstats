services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - pingpong_network

  redis:
    image: redis:7-alpine
    container_name: ttstats_redis_prod
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - redis_data_prod:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    networks:
      - pingpong_network

  web:
    # CI builds this and pushes it to GHCR; the deploy pulls it. The VPS has
    # 3.7GB of RAM and building here used to reach the OOM killer. WEB_IMAGE is
    # pinned to a commit SHA by the deploy job -- the :latest default is only
    # for running compose by hand on the box.
    image: ${WEB_IMAGE:-ghcr.io/eyedema/ttstats-web:latest}
    # Retained so `docker compose build` still works locally; normal deploys
    # never reach it, because they pull first.
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DJANGO_ENV: prod
    volumes:
      - static_volume:/app/static
    depends_on:
      - db
      - redis
    networks:
      - pingpong_network
      - pangolin

volumes:
  pgdata:
  redis_data_prod:
  static_volume:

networks:
  pingpong_network:
    driver: bridge
  pangolin:
    external: true
