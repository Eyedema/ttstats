services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pingpong_dev
      POSTGRES_USER: pingpong
      POSTGRES_PASSWORD: pingpong
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: ttstats_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    command: redis-server --appendonly yes

  # The web service bind-mounts ./ttstats over /app, which shadows the CSS the
  # image built at COPY --from=assets time. This service rebuilds it into the
  # mounted tree instead, and keeps rebuilding as templates change.
  assets:
    image: node:20-alpine
    working_dir: /build
    command: sh -c "npm ci && npm run vendor && npm run watch:css"
    volumes:
      - .:/build
      - node_modules_dev:/build/node_modules

  web:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env.dev
    volumes:
      - ./ttstats:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - assets

volumes:
  pgdata_dev:
  redis_data_dev:
  node_modules_dev:
