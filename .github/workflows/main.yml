name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    name: Run Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for git diff

      - name: Check for Python file changes
        id: check_files
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # For PRs, check files changed between base and head
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }})
          else
            # For pushes, check files in the current commit
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          fi
          
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          if echo "$CHANGED_FILES" | grep -q "\.py$"; then
            echo "Python files were changed"
            echo "py_changed=true" >> $GITHUB_OUTPUT
          else
            echo "No Python files were changed"
            echo "py_changed=false" >> $GITHUB_OUTPUT
          fi

          # Frontend assets are gated separately. Before this, a commit that
          # touched only templates or the Tailwind config got zero CI, so a
          # purge misconfiguration could ship unnoticed.
          if echo "$CHANGED_FILES" | grep -qE "\.(html|css|js)$|tailwind\.config\.js|postcss\.config\.js|package(-lock)?\.json"; then
            echo "Frontend files were changed"
            echo "assets_changed=true" >> $GITHUB_OUTPUT
          else
            echo "No frontend files were changed"
            echo "assets_changed=false" >> $GITHUB_OUTPUT
          fi

      # The test suite renders templates that {% static %}-reference app.css.
      # Build it whenever either side changed, so a broken Tailwind config
      # fails here rather than in production.
      - name: Set up Node
        if: steps.check_files.outputs.py_changed == 'true' || steps.check_files.outputs.assets_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build frontend assets
        if: steps.check_files.outputs.py_changed == 'true' || steps.check_files.outputs.assets_changed == 'true'
        run: |
          npm ci
          npm run build
          test -s ttstats/pingpong/static/pingpong/css/app.css
          test -s ttstats/pingpong/static/pingpong/js/vendor/htmx.min.js

      - name: Set up Python
        if: steps.check_files.outputs.py_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        if: steps.check_files.outputs.py_changed == 'true'
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        if: steps.check_files.outputs.py_changed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Ensure pytest and plugins are installed if not in requirements.txt
          pip install pytest pytest-django pytest-cov

      - name: Run tests with pytest
        if: steps.check_files.outputs.py_changed == 'true'
        env:
          DJANGO_SETTINGS_MODULE: ttstats.settings.test
          SECRET_KEY: "test-secret-key-for-ci-only"
        run: |
          cd ttstats
          pytest --cov=pingpong --cov-config=../.coveragerc --cov-report=term --cov-report=html -v -n auto

      - name: Generate coverage summary
        if: steps.check_files.outputs.py_changed == 'true'
        id: coverage
        run: |
          cd ttstats
          # Generate plain text report for the PR comment parsing
          coverage report > coverage_report.txt

          # Add to GitHub step summary
          echo "## 📊 Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage_report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          # Extract coverage percentage (keeping % sign for display)
          COVERAGE=$(coverage report | grep TOTAL | awk '{print $4}')
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total Coverage:** $COVERAGE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 Download the detailed HTML report from the artifacts section below." >> $GITHUB_STEP_SUMMARY

          # Console output
          echo ""
          echo "📊 Coverage Report:"
          echo "===================="
          cat coverage_report.txt
          echo ""
          echo "✅ Total Coverage: $COVERAGE"

          # Save for next step
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT

      - name: Skip message
        if: steps.check_files.outputs.py_changed == 'false'
        run: |
          echo "⏭️  Skipping tests - no Python files were changed" >> $GITHUB_STEP_SUMMARY
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && steps.check_files.outputs.py_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverageReport = fs.readFileSync('ttstats/coverage_report.txt', 'utf8');
            const coverage = '${{ steps.coverage.outputs.coverage }}';
            
            const comment = `## 📊 Test Coverage Report
            **Total Coverage:** ${coverage}
            
            \`\`\`
            ${coverageReport}
            \`\`\`
            
            📥 Download detailed HTML report
            The full HTML coverage report is available in the **Artifacts** section of this workflow run.
            Click on "coverage-report" to download and view locally.
            
            ✅ All tests passed!`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Upload coverage HTML report
        if: steps.check_files.outputs.py_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ttstats/htmlcov/
          retention-days: 30

  deploy:
    name: Deploy to VPS
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # appleboy/ssh-action defaults to a 10m command_timeout, which is
          # shorter than a cold `--build` on this VPS: the deploy of the
          # participant refactor was killed while apt was still installing
          # build-essential, leaving the repo pulled but the containers on the
          # previous image. The build is the slow part, not the migrate.
          command_timeout: 40m
          script: |
            set -e
            cd ${{ secrets.WORK_DIR }}
            git pull
            docker compose -f compose.prod.yml up -d --build
            docker compose -f compose.prod.yml exec -T web python manage.py migrate
            docker compose -f compose.prod.yml exec -T web python manage.py collectstatic --noinput

      - name: Deployment status
        run: echo "✅ Deployment to VPS completed successfully!"
