name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # One place that decides what changed. This used to live inside the test job,
  # but the e2e gate needs the same answer and two copies of the logic would
  # drift -- which is the exact failure that once gave template-only commits no
  # CI at all.
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      py_changed: ${{ steps.check_files.outputs.py_changed }}
      assets_changed: ${{ steps.check_files.outputs.assets_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for git diff

      - name: Check for Python file changes
        id: check_files
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # For PRs, check files changed between base and head
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }})
          else
            # For pushes, check files in the current commit
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -q "\.py$"; then
            echo "Python files were changed"
            echo "py_changed=true" >> $GITHUB_OUTPUT
          else
            echo "No Python files were changed"
            echo "py_changed=false" >> $GITHUB_OUTPUT
          fi

          # Frontend assets are gated separately. Before this, a commit that
          # touched only templates or the Tailwind config got zero CI, so a
          # purge misconfiguration could ship unnoticed.
          # .webmanifest is here because the PWA manifest is a template like
          # any other -- without it, a commit touching only the manifest would
          # skip the browser tests that check the app is still installable.
          if echo "$CHANGED_FILES" | grep -qE "\.(html|css|js|webmanifest)$|tailwind\.config\.js|postcss\.config\.js|package(-lock)?\.json"; then
            echo "Frontend files were changed"
            echo "assets_changed=true" >> $GITHUB_OUTPUT
          else
            echo "No frontend files were changed"
            echo "assets_changed=false" >> $GITHUB_OUTPUT
          fi

  test:
    name: Run Tests & Coverage
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for git diff

      # The test suite renders templates that {% static %}-reference app.css.
      # Build it whenever either side changed, so a broken Tailwind config
      # fails here rather than in production.
      - name: Set up Node
        if: needs.changes.outputs.py_changed == 'true' || needs.changes.outputs.assets_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build frontend assets
        if: needs.changes.outputs.py_changed == 'true' || needs.changes.outputs.assets_changed == 'true'
        run: |
          npm ci
          npm run build
          test -s ttstats/pingpong/static/pingpong/css/app.css
          test -s ttstats/pingpong/static/pingpong/js/vendor/htmx.min.js

      - name: Set up Python
        if: needs.changes.outputs.py_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        if: needs.changes.outputs.py_changed == 'true'
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        if: needs.changes.outputs.py_changed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Ensure pytest and plugins are installed if not in requirements.txt
          pip install pytest pytest-django pytest-cov

      - name: Run tests with pytest
        if: needs.changes.outputs.py_changed == 'true'
        env:
          DJANGO_SETTINGS_MODULE: ttstats.settings.test
          SECRET_KEY: "test-secret-key-for-ci-only"
        run: |
          cd ttstats
          pytest --cov=pingpong --cov-config=../.coveragerc --cov-report=term --cov-report=html -v -n auto

      - name: Generate coverage summary
        if: needs.changes.outputs.py_changed == 'true'
        id: coverage
        run: |
          cd ttstats
          # Generate plain text report for the PR comment parsing
          coverage report > coverage_report.txt

          # Add to GitHub step summary
          echo "## 📊 Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage_report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          # Extract coverage percentage (keeping % sign for display)
          COVERAGE=$(coverage report | grep TOTAL | awk '{print $4}')
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total Coverage:** $COVERAGE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 Download the detailed HTML report from the artifacts section below." >> $GITHUB_STEP_SUMMARY

          # Console output
          echo ""
          echo "📊 Coverage Report:"
          echo "===================="
          cat coverage_report.txt
          echo ""
          echo "✅ Total Coverage: $COVERAGE"

          # Save for next step
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT

      - name: Skip message
        if: needs.changes.outputs.py_changed == 'false'
        run: |
          echo "⏭️  Skipping tests - no Python files were changed" >> $GITHUB_STEP_SUMMARY
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && needs.changes.outputs.py_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverageReport = fs.readFileSync('ttstats/coverage_report.txt', 'utf8');
            const coverage = '${{ steps.coverage.outputs.coverage }}';
            
            const comment = `## 📊 Test Coverage Report
            **Total Coverage:** ${coverage}
            
            \`\`\`
            ${coverageReport}
            \`\`\`
            
            📥 Download detailed HTML report
            The full HTML coverage report is available in the **Artifacts** section of this workflow run.
            Click on "coverage-report" to download and view locally.
            
            ✅ All tests passed!`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Upload coverage HTML report
        if: needs.changes.outputs.py_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ttstats/htmlcov/
          retention-days: 30

  # Real WebKit at an iPhone viewport. This job exists because a drawer shipped
  # that was permanently open and unclosable on iOS Safari while every check
  # above was green: pytest asserts on the rendered template string, and the
  # string was perfect. Nothing here can be established by the job above.
  #
  # Note the job itself always runs and gates its own steps, rather than being
  # skipped by an `if:` at the job level. A skipped job causes everything that
  # `needs` it to skip too, which would silently take the deploy with it.
  e2e:
    name: Browser tests (WebKit / iPhone)
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        if: needs.changes.outputs.py_changed == 'true' || needs.changes.outputs.assets_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Python
        if: needs.changes.outputs.py_changed == 'true' || needs.changes.outputs.assets_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        if: needs.changes.outputs.py_changed == 'true' || needs.changes.outputs.assets_changed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm ci

      # Keyed on the resolved Playwright version: a browser build only matches
      # the client that shipped with it, so a bare "playwright" key would serve
      # a stale binary after an upgrade.
      - name: Resolve Playwright version
        if: needs.changes.outputs.py_changed == 'true' || needs.changes.outputs.assets_changed == 'true'
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        if: needs.changes.outputs.py_changed == 'true' || needs.changes.outputs.assets_changed == 'true'
        id: pw_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      # --with-deps pulls the system libraries WebKit needs on a bare runner.
      # Only webkit: the default suite does not use Chromium or Firefox, and
      # installing all three roughly triples this step.
      - name: Install WebKit
        if: >-
          (needs.changes.outputs.py_changed == 'true' || needs.changes.outputs.assets_changed == 'true')
          && steps.pw_cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps webkit

      - name: Install WebKit system deps (cached browser)
        if: >-
          (needs.changes.outputs.py_changed == 'true' || needs.changes.outputs.assets_changed == 'true')
          && steps.pw_cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps webkit

      # scripts/e2e_server.sh rebuilds the CSS, migrates a throwaway SQLite
      # file and seeds the fixture; Playwright starts and stops it.
      - name: Run Playwright suite
        if: needs.changes.outputs.py_changed == 'true' || needs.changes.outputs.assets_changed == 'true'
        env:
          E2E_PYTHON: python
          SECRET_KEY: "test-secret-key-for-ci-only"
        run: npx playwright test --project=setup --project=iphone-safari --project=iphone-no-js --project=iphone-reduced

      - name: Upload Playwright report
        if: >-
          failure()
          && (needs.changes.outputs.py_changed == 'true' || needs.changes.outputs.assets_changed == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Skip message
        if: needs.changes.outputs.py_changed == 'false' && needs.changes.outputs.assets_changed == 'false'
        run: echo "⏭️  Skipping browser tests - no Python or frontend files were changed" >> $GITHUB_STEP_SUMMARY

  # The image is built here, on a 16GB runner, instead of on the 3.7GB VPS.
  # Building there spiked memory hard enough to reach the OOM killer and made a
  # cold deploy take longer than the SSH action's timeout.
  build-image:
    name: Build & push image
    needs: [test, e2e]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # GHCR rejects uppercase path segments and the owner is "Eyedema".
      - name: Compute image name
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/ttstats-web" >> $GITHUB_OUTPUT

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/django/Dockerfile
          # The VPS is x86_64. Building only what it runs keeps this fast.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: [test, e2e, build-image]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        env:
          # Pinned to this commit's image, so a rollback is just re-running an
          # older deploy rather than a rebuild.
          WEB_IMAGE: ${{ needs.build-image.outputs.image }}:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # The VPS no longer builds, so this is pull + restart + migrate. The
          # generous timeout is kept for the migrate step, which is the only
          # part whose duration depends on the data.
          command_timeout: 20m
          # GITHUB_TOKEN is what lets the VPS pull from GHCR without a
          # long-lived deploy key or making the package public.
          envs: WEB_IMAGE,GHCR_TOKEN,GHCR_USER
          script: |
            set -e
            cd ${{ secrets.WORK_DIR }}
            git pull
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export WEB_IMAGE
            docker compose -f compose.prod.yml pull web
            docker compose -f compose.prod.yml up -d
            docker compose -f compose.prod.yml exec -T web python manage.py migrate
            docker compose -f compose.prod.yml exec -T web python manage.py collectstatic --noinput
            docker logout ghcr.io
            # Keep the box from filling up with superseded images.
            docker image prune -f

      - name: Deployment status
        run: echo "✅ Deployment to VPS completed successfully!"
